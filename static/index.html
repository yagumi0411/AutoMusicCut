<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMusicCut — 唱歌片段剪切</title>
<style>
:root { color-scheme: dark; --bg: #1e1e2e; --surface: #181825; --line: #38394d;
        --text: #cdd6f4; --muted: #a6adc8; --accent: #a6e3a1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px;
       background: var(--bg); color: var(--text); display: flex; flex-direction: column;
       height: 100dvh; }
header { padding: 20px 24px 16px; background: #181825; border-bottom: 1px solid var(--line); }
.brand-row, .source-row, .panel-heading, .panel-actions { display: flex; align-items: center; gap: 12px; }
.brand-row { justify-content: space-between; margin-bottom: 18px; }
header h1 { font-size: 22px; letter-spacing: -.025em; color: #f5c2e7; }
.brand-copy { display: flex; align-items: baseline; gap: 16px; }
.subtitle, .panel-note, .source-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
.workflow { display: flex; gap: 18px; list-style: none; color: var(--muted); font-size: 12px; }
.workflow li { display: flex; align-items: center; gap: 7px; }
.workflow span { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #585b70; border-radius: 50%; font-variant-numeric: tabular-nums; }
.source-row { flex-wrap: wrap; }
.source-field { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 12px; }
#video-path { flex: 1; min-width: 0; }
.source-note { margin-top: 9px; }
.player-toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; margin-left: 8px; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type=text], input[type=number] { background: #313244; color: #cdd6f4;
         border: 1px solid #585b70; border-radius: 6px; padding: 8px 10px; font: inherit; }
input::placeholder { color: #a6adc8; }
button { background: #45475a; color: #cdd6f4; border: 1px solid transparent; border-radius: 6px;
         padding: 8px 12px; min-height: 36px; cursor: pointer; font: inherit; font-size: 12px;
         transition: background .15s ease, border-color .15s ease; white-space: nowrap; }
button:hover { background: #6c7086; }
button:active { background: #585b70; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid #89b4fa; outline-offset: 3px; }
::selection { background: #89b4fa; color: #11111b; }
input { caret-color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: #585b70 #181825; }
button.primary { background: #a6e3a1; color: #1e1e2e; }
button.primary:hover { background: #b8eeb2; }
button.del-row { background: transparent; color: #f38ba8; }
button.del-row:hover { background: #463040; }
main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 20px 24px; overflow: hidden; }
.panel { background: #181825; border: 1px solid var(--line); border-radius: 12px;
         display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#panel-cand { flex: 1.15; }
#panel-songs { flex: 1; }
.panel-heading { justify-content: space-between; padding: 18px 18px 12px; flex-wrap: wrap; }
.panel h2 { font-size: 16px; font-weight: 600; color: #cdd6f4; }
.panel-note { margin-top: 4px; }
.panel-actions { flex-wrap: wrap; padding: 14px 18px; border-top: 1px solid var(--line); }
.action-spacer { flex: 1; }
#save-state { color: var(--muted); font-size: 12px; }
#save-state.dirty { color: #f9e2af; }
.tbl-wrap { flex: 1; overflow: auto; min-height: 120px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #313244;
         white-space: nowrap; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 1; background: #222233; color: #a6adc8; font-weight: 500; font-size: 12px; }
td[colspan] { padding: 52px 20px; text-align: center; white-space: normal; color: var(--muted); line-height: 1.9; }
td[colspan] strong { display: block; font-size: 15px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
#tbl-songs .in-name { min-width: 140px; }
#tbl-songs .in-start, #tbl-songs .in-end { width: 98px; font-variant-numeric: tabular-nums; }
#tbl-cand td:last-child { white-space: normal; min-width: 165px; }
#tbl-cand td button { margin: 2px 0; padding: 6px 8px; min-height: 32px; }
#tbl-cand .add-cand { color: #a6e3a1; border-color: #526650; background: transparent; }
#tbl-cand .add-cand:hover { background: #2e4035; }
tr.cand { cursor: pointer; }
tr.cand:hover { background: #313244; }
tr.selected { background: #303a4f; }
td input { width: 100%; min-width: 60px; }
td.jump { cursor: pointer; }
td.jump:hover { color: #89b4fa; text-decoration: underline; }
.conf-高 { color: #a6e3a1; }
.conf-中 { color: #f9e2af; }
.conf-低 { color: #f38ba8; }
#video-wrap { display: none; position: relative; padding: 12px 16px 8px; background: #11111b;
              border-top: 1px solid #313244; height: 310px; flex: 0 0 auto; }
#player-resizer { position: absolute; top: 0; left: 0; right: 0; height: 9px;
                  cursor: ns-resize; touch-action: none; user-select: none; }
#player-resizer::after { content: ''; display: block; width: 48px; height: 3px;
                         margin: 3px auto; border-radius: 2px; background: #585b70; }
#player-resizer:hover, #player-resizer:focus-visible { background: #313244; }
#player-layout { display: flex; gap: 12px; align-items: stretch; height: 100%; min-height: 0; }
#player-column { flex: 2 1 640px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#player { width: 100%; flex: 1; min-height: 0; object-fit: contain; display: block; }
#player-ctrl { flex-shrink: 0; }
#player-ctrl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
               margin-top: 6px; }
#player-ctrl button { padding: 4px 9px; font-size: 12px; }
#player-ctrl button.active { background: #89b4fa; color: #1e1e2e; }
#player-ctrl .sep { width: 1px; height: 18px; background: #45475a; margin: 0 4px; }
#player-time { font-variant-numeric: tabular-nums; color: #a6adc8; font-size: 12px; }
#transcript-panel { flex: 1 1 320px; min-width: 0; min-height: 0; background: #181825;
                    border: 1px solid #313244; border-radius: 6px; display: flex;
                    flex-direction: column; overflow: hidden; }
#transcript-head { padding: 7px 10px; color: #89b4fa; font-size: 13px; display: flex;
                   align-items: center; gap: 8px; border-bottom: 1px solid #313244; }
#btn-copy-transcript-panel { padding: 3px 8px; font-size: 12px; }
#transcript-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 7px 0;
                   border-bottom: 1px solid #313244; }
#transcript-head, #transcript-tabs { flex-shrink: 0; }
@media (max-width: 700px) {
  #player-layout { flex-direction: column; }
  #player-column, #transcript-panel { flex: 1 1 0; }
}
.transcript-tab { flex: 0 0 auto; padding: 4px 8px; font-size: 12px; border-radius: 4px 4px 0 0; }
.transcript-tab.active { background: #89b4fa; color: #1e1e2e; }
#transcript-content { flex: 1; overflow: auto; margin: 0; padding: 10px; white-space: pre-wrap;
                      color: #cdd6f4; font-size: 13px; line-height: 1.6; }
#transcript-content.empty { color: #a6adc8; }
#log { position: fixed; left: calc(100% - 432px); top: calc(100% - 170px);
       width: 420px; z-index: 15; background: #11111b; border: 1px solid #313244;
       border-radius: 6px; display: none; font-size: 12px; color: #a6adc8;
       box-shadow: 0 4px 16px rgba(0,0,0,.4); }
#log-head { display: flex; align-items: center; padding: 6px 10px;
            border-bottom: 1px solid #313244; color: #89b4fa;
            font-weight: bold; cursor: move; user-select: none; }
#log-head .spacer { flex: 1; }
#log-close { background: none; border: none; color: #a6adc8; cursor: pointer;
             font-size: 14px; padding: 2px 6px; }
#log-close:hover { color: #f38ba8; }
#log-body { overflow: auto; max-height: 130px; padding: 6px 10px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
         align-items: center; justify-content: center; z-index: 10; }
.modal-box { background: #1e1e2e; border: 1px solid #45475a; border-radius: 12px;
             width: 560px; max-width: calc(100vw - 32px); max-height: 80dvh; display: flex; flex-direction: column; }
.modal-head { padding: 8px 12px; display: flex; justify-content: space-between;
              align-items: center; border-bottom: 1px solid #313244; }
.modal-list { overflow: auto; flex: 1; padding: 4px 0; }
.modal-list div { padding: 12px 16px; cursor: pointer; display: flex; gap: 12px;
                  justify-content: space-between; overflow-wrap: anywhere; }
#browse-path { overflow-wrap: anywhere; min-width: 0; font-size: 12px; }
.modal-list div:hover { background: #313244; }
.dir { color: #89b4fa; }
.size { color: #a6adc8; font-size: 12px; flex-shrink: 0; }
#progress { display: none; margin-left: 8px; color: #f9e2af; font-size: 12px; }
#candidate-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #a6adc8; font-size: 12px;
                     padding: 0 18px 14px; }
#candidate-filters label { display: flex; align-items: center; gap: 6px; }
#candidate-filters input { width: 66px; padding: 6px; }
#candidate-filter-summary { color: #89b4fa; white-space: nowrap; }
#btn-clear-candidate-filters { padding: 4px 8px; font-size: 12px; }
#drop-hint { display: none; position: fixed; inset: 0; z-index: 20; pointer-events: none;
             background: rgba(166,227,161,.12); border: 3px dashed #a6e3a1;
             align-items: center; justify-content: center; font-size: 18px; color: #a6e3a1; }
body.dragging #drop-hint { display: flex; }
@media (max-width: 1100px) {
  .brand-copy { align-items: flex-start; flex-direction: column; gap: 3px; }
  main { gap: 12px; padding: 16px; }
  .panel-heading, .panel-actions { padding-left: 14px; padding-right: 14px; }
}
@media (max-width: 900px) {
  body { height: auto; min-height: 100dvh; }
  header { padding: 18px 16px 14px; }
  main { flex-direction: column; overflow: visible; flex: none; }
  .panel { flex: none !important; }
  .tbl-wrap { max-height: 420px; }
  #video-wrap { flex-shrink: 0; }
  #log { width: min(420px, calc(100vw - 24px)); left: auto; right: 12px; top: auto; bottom: 12px; }
}
@media (max-width: 600px) {
  .brand-row { align-items: flex-start; flex-direction: column; gap: 12px; }
  .workflow { gap: 14px; }
  .source-field { flex-basis: 100%; }
  .source-field > label { font-size: 12px; }
  .source-row { gap: 8px; }
  .player-toggle { margin-left: auto; font-size: 12px; }
  main { padding: 12px; }
  button { min-height: 40px; }
  .panel-actions { gap: 8px; }
  .action-spacer { display: none; }
  #save-state { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand-copy"><h1>AutoMusicCut</h1><span class="subtitle">从录播中找到歌曲，试听确认后批量剪切</span></div>
    <ol class="workflow" aria-label="操作流程"><li><span>1</span>选择视频</li><li><span>2</span>分析与试听</li><li><span>3</span>整理与剪切</li></ol>
  </div>
  <div class="source-row">
    <div class="source-field"><label for="video-path">视频路径</label><input id="video-path" type="text" placeholder="粘贴本地视频路径，或点击浏览选择"></div>
    <button id="btn-browse">浏览文件</button>
    <button id="btn-analyze" class="primary">开始分析</button>
    <label class="player-toggle"><input id="chk-player" type="checkbox"> 内嵌播放器</label>
  </div>
  <div class="source-note">支持拖入视频 · 点击候选段起止时间可定位试听<span id="progress" role="status" aria-live="polite"></span></div>
</header>

<main>
  <div class="panel" id="panel-cand">
    <div class="panel-heading">
      <div><h2>候选唱歌段</h2><p class="panel-note">试听起止位置，再将需要的片段加入清单</p></div>
      <button id="btn-recognize-all">全部识别歌名</button>
    </div>
      <div id="candidate-filters">
        <label>最短 <input id="filter-min-duration" type="number" min="0" step="0.1" placeholder="秒"> 秒</label>
        <label>最低置信度 <input id="filter-min-confidence" type="number" min="0" max="1" step="0.01" placeholder="0–1"></label>
        <span id="candidate-filter-summary">显示 0 / 0 条</span>
        <button id="btn-clear-candidate-filters" type="button">清除过滤</button>
      </div>
    <div class="tbl-wrap">
      <table id="tbl-cand">
        <thead><tr>
          <th>#</th><th>开始</th><th>结束</th><th>时长</th><th>置信度</th>
          <th>概率</th><th>操作</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="panel" id="panel-songs">
    <div class="panel-heading"><div><h2>剪切清单</h2><p class="panel-note">可编辑歌名与起止时间，保存到 songs.txt</p></div><span id="save-state" role="status">清单已保存</span></div>
    <div class="tbl-wrap">
      <table id="tbl-songs">
        <thead><tr>
          <th style="width:36px">#</th><th>歌曲名</th><th>开始</th><th>结束</th>
          <th style="width:60px">操作</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel-actions">
      <button id="btn-add-row">添加片段</button>
      <button id="btn-save-songs" title="Ctrl+S 保存清单">保存清单</button>
      <span class="action-spacer"></span>
      <button id="btn-cut" class="primary">开始剪切</button>
      <button id="btn-open-out">打开输出目录</button>
    </div>
  </div>
</main>

<div id="video-wrap">
  <div id="player-resizer" role="separator" aria-label="调整播放器和歌词区域高度"
       aria-orientation="horizontal" tabindex="0" title="上下拖动调整高度，也可使用上下方向键"></div>
  <div id="player-layout">
    <div id="player-column">
      <video id="player" controls></video>
      <div id="player-ctrl">
        <span id="player-time">00:00:00 / 00:00:00</span>
        <span class="sep"></span>
        <button data-seek="-10">-10s</button>
        <button data-seek="-5">-5s</button>
        <button data-seek="-1">-1s</button>
        <button data-seek="1">+1s</button>
        <button data-seek="5">+5s</button>
        <button data-seek="10">+10s</button>
        <span class="sep"></span>
        <button data-rate="0.5">0.5×</button>
        <button data-rate="1" class="active">1×</button>
        <button data-rate="1.5">1.5×</button>
        <button data-rate="2">2×</button>
      </div>
    </div>
    <aside id="transcript-panel">
      <div id="transcript-head"><span>转写歌词</span><span style="flex:1"></span>
        <button id="btn-copy-transcript-panel" type="button">复制</button></div>
      <div id="transcript-tabs"></div>
      <pre id="transcript-content" class="empty">点击候选段的“转文字”后，识别结果会显示在这里。</pre>
    </aside>
  </div>
</div>
<div id="log">
  <div id="log-head"><span>日志</span><span class="spacer"></span>
    <button id="log-close" title="收起">✕</button></div>
  <div id="log-body"></div>
</div>
<div id="drop-hint">松开鼠标导入视频</div>

<div class="modal" id="recognize-modal">
  <div class="modal-box" style="width:640px" role="dialog" aria-modal="true" aria-labelledby="recognize-head">
    <div class="modal-head">
      <span id="recognize-head"></span>
      <button id="btn-recognize-close">关闭</button>
    </div>
    <div style="padding:8px 12px; border-bottom:1px solid #313244; color:#a6adc8; font-size:12px"
         id="recognize-transcript"></div>
    <div class="modal-list" id="recognize-list"></div>
  </div>
</div>

<div class="modal" id="browse-modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="选择视频文件">
    <div class="modal-head">
      <span id="browse-path"></span>
      <button id="btn-browse-close">关闭</button>
    </div>
    <div class="modal-list" id="browse-list"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtH = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let currentVideo = localStorage.getItem('amc_video') || '';
let outDir = '';
let songRevision = 0;
let songsDirty = false;
let songsLoaded = false;
let videoRevision = 0;
let videoRequest = 0;
let candidatesRequest = 0;
let songsRequest = 0;
let saveQueue = Promise.resolve();
const transcriptTabs = new Map();
let activeTranscriptKey = '';
$('video-path').value = currentVideo;

function markSongsDirty() {
  songRevision++;
  songsDirty = true;
  $('save-state').textContent = '有未保存的修改';
  $('save-state').classList.add('dirty');
}
function markSongsSaved() {
  songsDirty = false;
  $('save-state').textContent = '清单已保存';
  $('save-state').classList.remove('dirty');
}
$('tbl-songs').addEventListener('input', markSongsDirty);
document.addEventListener('keydown', event => {
  const modal = Array.from(document.querySelectorAll('.modal')).find(el => el.style.display === 'flex');
  if (event.key === 'Tab' && modal) {
    const controls = Array.from(modal.querySelectorAll('button, [tabindex="0"]'));
    const first = controls[0], last = controls[controls.length - 1];
    if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) {
      event.preventDefault(); first.focus();
    }
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
    event.preventDefault();
    $('btn-save-songs').click();
  }
  if (event.key === 'Escape') {
    if ($('browse-modal').style.display === 'flex') { closeBrowse(); $('btn-browse').focus(); }
    else if ($('recognize-modal').style.display === 'flex') {
      $('recognize-modal').style.display = 'none';
      $('btn-recognize-all').focus();
    }
  }
});
window.addEventListener('beforeunload', event => {
  if (songsDirty) { event.preventDefault(); event.returnValue = ''; }
});

function makeKeyboardAction(element, label) {
  element.tabIndex = 0;
  element.setAttribute('role', 'button');
  if (label) element.setAttribute('aria-label', label);
  element.addEventListener('keydown', event => {
    if (event.target !== element || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    element.click();
  });
}

function candidateMatchesFilters(c) {
  const minDuration = $('filter-min-duration').valueAsNumber;
  const minConfidence = $('filter-min-confidence').valueAsNumber;
  return (Number.isNaN(minDuration) || c.duration >= minDuration) &&
    (Number.isNaN(minConfidence) || c.score >= minConfidence);
}

async function apiRequest(url, options) {
  const response = await fetch(url, options);
  let data;
  try { data = await response.json(); }
  catch (_) { throw new Error(`服务返回无效响应（HTTP ${response.status}）`); }
  if (!response.ok) {
    const detail = Array.isArray(data.detail) ? data.detail.map(item => item.msg).join('；') : data.detail;
    throw new Error(detail || `请求失败（HTTP ${response.status}）`);
  }
  return data;
}

function reportError(error) {
  log('操作失败: ' + error.message);
  $('progress').textContent = '操作失败，请查看日志后重试';
  $('progress').style.display = 'inline';
}

// 选定视频后返回会话目录，调用方确认请求仍有效后再更新界面。
async function syncOutDir(video = currentVideo) {
  return apiRequest('/api/select-video', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({video}),
  });
}

// 切换前保存旧会话；迟到的请求和旧任务结果不能覆盖新会话。
async function setVideo(path, reload = false) {
  const request = ++videoRequest;
  try {
    if (path !== currentVideo && songsDirty && !(await saveSongs())) {
      throw new Error('当前清单保存失败，请修正后再切换视频');
    }
    if (request !== videoRequest) return false;
    if (path !== currentVideo && songsDirty) {
      throw new Error('清单在保存期间发生修改，请保存后再次切换视频');
    }
    const session = await syncOutDir(path);
    if (request !== videoRequest) return false;
    const video = session.video || path;
    const changed = currentVideo !== video;
    if ((changed || reload || !songsLoaded) && songsDirty) {
      throw new Error('清单有新的未保存修改，请保存后再次切换视频');
    }
    currentVideo = video;
    outDir = session.result;
    $('video-path').value = video;
    localStorage.setItem('amc_video', video);
    if (changed || reload || !songsLoaded) {
      videoRevision++;
      songRevision++;
      songsLoaded = false;
      $('btn-add-row').disabled = true;
      resetTranscriptTabs();
      $('recognize-modal').style.display = 'none';
      $('tbl-cand').querySelector('tbody').innerHTML = '';
      $('tbl-songs').querySelector('tbody').innerHTML = '';
      markSongsSaved();
      await Promise.all([loadCandidates(video), loadSongs(video)]);
    }
    initPlayer();
    return request === videoRequest;
  } catch (error) {
    if (request === videoRequest) $('video-path').value = currentVideo;
    throw error;
  }
}

// 按住标题栏拖动日志面板，限制在窗口范围内
(() => {
  const panel = $('log'), head = $('log-head');
  let dx = 0, dy = 0, dragging = false;
  head.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;   // 不抢关闭按钮的点击
    const r = panel.getBoundingClientRect();
    // 首次拖动把 CSS 的 calc() 定位换算成像素，之后直接改 left/top
    panel.style.left = r.left + 'px';
    panel.style.top = r.top + 'px';
    dx = e.clientX - r.left;
    dy = e.clientY - r.top;
    dragging = true;
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const left = Math.min(Math.max(0, e.clientX - dx),
                          window.innerWidth - panel.offsetWidth);
    const top = Math.min(Math.max(0, e.clientY - dy),
                         window.innerHeight - panel.offsetHeight);
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    document.body.style.userSelect = '';
  });
})();

// ---------- 任务轮询 ----------
async function pollTask(taskId, onDone, onError) {
  if (!taskId) throw new Error('未能启动任务，请重试');
  let seenMessages = [];
  for (;;) {
    const r = await apiRequest(`/api/task/${taskId}`);
    $('progress').style.display = 'block';
    const msgs = r.messages || [];
    if (msgs.length) $('progress').textContent = msgs[msgs.length - 1];
    let overlap = Math.min(seenMessages.length, msgs.length);
    while (overlap && !seenMessages.slice(-overlap).every((msg, i) => msg === msgs[i])) overlap--;
    msgs.slice(overlap).forEach(log);
    seenMessages = msgs;
    if (r.status === 'done') { $('progress').textContent = '完成'; await onDone(r.result); break; }
    if (r.status === 'error') {
      $('progress').textContent = '失败';
      log('错误: ' + r.error);
      if (onError) onError(r.error);
      break;
    }
    await new Promise(res => setTimeout(res, 1000));
  }
  setTimeout(() => $('progress').style.display = 'none', 3000);
}

// ---------- 候选清单 ----------
async function loadCandidates(video = currentVideo) {
  if (video !== currentVideo) return;
  const revision = videoRevision, request = ++candidatesRequest;
  const r = video ? await apiRequest(`/api/candidates?video=${encodeURIComponent(video)}`) :
    {exists: false, candidates: []};
  if (video !== currentVideo || revision !== videoRevision || request !== candidatesRequest) return;
  const tb = $('tbl-cand').querySelector('tbody');
  tb.innerHTML = '';
  if (!r.exists || !r.candidates.length) {
    $('candidate-filter-summary').textContent = '显示 0 / 0 条';
    tb.innerHTML = '<tr><td colspan="7"><strong>等待分析视频</strong>选择视频后点击“开始分析”，唱歌片段会显示在这里。</td></tr>';
    return;
  }
  const candidates = r.candidates.filter(candidateMatchesFilters);
  $('candidate-filter-summary').textContent = `显示 ${candidates.length} / ${r.candidates.length} 条`;
  if (!candidates.length) {
    tb.innerHTML = '<tr><td colspan="7"><strong>没有符合条件的片段</strong>试试降低最短时长或置信度，或点击“清除过滤”。</td></tr>';
    return;
  }
  for (const c of candidates) {
    const tr = document.createElement('tr');
    tr.className = 'cand';
    tr.innerHTML = `<td>${c.index}</td>
      <td class="jump" data-t="start" title="跳转到开始时间">${c.start_str}</td>
      <td class="jump" data-t="end" title="跳转到结束时间">${c.end_str}</td>
      <td>${fmtH(c.duration).slice(3)}</td>
      <td class="conf-${c.confidence}">${c.confidence}</td>
      <td>${c.score.toFixed(2)}</td>
      <td><button class="recognize-cand">识别</button> <button class="add-cand">＋清单</button> <button class="transcribe-cand">转文字</button></td>`;
    tr.onclick = e => {
      if (e.target.closest('button')) return;
      tb.querySelectorAll('.selected').forEach(row => row.classList.remove('selected'));
      tr.classList.add('selected');
      // 点开始/结束单元格跳到各自时间，点行内其他位置默认跳到开始
      const cell = e.target.closest('td.jump');
      jumpTo(cell && cell.dataset.t === 'end' ? c.end : c.start);
    };
    tr.querySelectorAll('td.jump').forEach(cell => makeKeyboardAction(cell,
      `试听第 ${c.index} 段${cell.dataset.t === 'end' ? '结束' : '开始'}位置 ${cell.textContent}`));
    tr.querySelector('.recognize-cand').onclick = () => recognizeSegment(c.start, c.end, c.start_str, c.end_str).catch(reportError);
    tr.querySelector('.add-cand').onclick = () => addCandidate(c).catch(reportError);
    tr.querySelector('.transcribe-cand').onclick = () => transcribeSegment(c.start, c.end, c.start_str, c.end_str).catch(reportError);
    tb.appendChild(tr);
  }
}

// ---------- 歌名识别 ----------
async function recognizeSegment(start, end, startStr, endStr) {
  if (!currentVideo) { alert('请先填写视频路径'); return; }
  const video = currentVideo, revision = videoRevision;
  showRecognizeModal('识别中…', '正在转写歌词，请稍候');
  const r = await apiRequest('/api/recognize', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({video, start, end}),
  });
  await pollTask(r.task_id,
    result => { if (video === currentVideo && revision === videoRevision) renderRecognizeResult(result, startStr, endStr); },
    err => { if (video === currentVideo && revision === videoRevision) {
      $('recognize-head').textContent = '识别失败'; $('recognize-transcript').textContent = err;
    } });
}

async function transcribeSegment(start, end, startStr, endStr) {
  if (!currentVideo) { alert('请先填写视频路径'); return; }
  const video = currentVideo, revision = videoRevision;
  const key = `${startStr}-${endStr}`;
  setTranscriptTab(key, `${startStr} - ${endStr}`, '正在转写音频，请稍候');
  const r = await apiRequest('/api/transcribe', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({video, start, end}),
  });
  await pollTask(r.task_id, result => {
    if (currentVideo === video && revision === videoRevision) {
      setTranscriptTab(key, `${startStr} - ${endStr}`,
        result.transcript || '（未识别出文本）', activeTranscriptKey === key);
    }
  }, err => {
    if (currentVideo === video && revision === videoRevision) {
      setTranscriptTab(key, `${startStr} - ${endStr}`, `转文字失败：${err}`,
        activeTranscriptKey === key);
    }
  });
}

function setTranscriptTab(key, label, text, activate = true) {
  let item = transcriptTabs.get(key);
  if (!item) {
    const button = document.createElement('button');
    button.className = 'transcript-tab';
    button.textContent = label;
    button.onclick = () => selectTranscriptTab(key);
    $('transcript-tabs').appendChild(button);
    item = {button, text: ''};
    transcriptTabs.set(key, item);
  }
  item.text = text;
  if (activate) selectTranscriptTab(key);
}

function selectTranscriptTab(key) {
  const item = transcriptTabs.get(key);
  if (!item) return;
  activeTranscriptKey = key;
  transcriptTabs.forEach((tab, tabKey) =>
    tab.button.classList.toggle('active', tabKey === key));
  const content = $('transcript-content');
  content.textContent = item.text;
  content.classList.toggle('empty', !item.text || item.text.startsWith('（'));
}

function resetTranscriptTabs() {
  transcriptTabs.clear();
  activeTranscriptKey = '';
  $('transcript-tabs').innerHTML = '';
  const content = $('transcript-content');
  content.textContent = '点击候选段的“转文字”后，识别结果会显示在这里。';
  content.classList.add('empty');
}

$('btn-copy-transcript-panel').onclick = async () => {
  const text = $('transcript-content').textContent;
  if (!activeTranscriptKey || !text || text.startsWith('（')) return;
  try {
    await navigator.clipboard.writeText(text);
    $('btn-copy-transcript-panel').textContent = '已复制';
    setTimeout(() => $('btn-copy-transcript-panel').textContent = '复制', 1500);
  } catch (_) {
    alert('复制失败，请手动选择文本复制');
  }
};

async function recognizeAll() {

function renderRecognizeResult(r, startStr, endStr) {
  $('recognize-head').textContent = `识别结果（${startStr} ~ ${endStr}）`;
  $('recognize-transcript').textContent = '转写歌词: ' + (r.transcript || '（无歌词文本）');

  list.innerHTML = '';
  if (!r.candidates || !r.candidates.length) {
    list.innerHTML = '<div>未能匹配到歌名（可手动填写）</div>';
    return;
  }
  r.candidates.forEach(c => {
    const div = document.createElement('div');
    div.innerHTML = `<span>${esc(c.title)} — ${esc(c.artist)}</span>
      <span class="size">${c.confidence} 置信 ${(c.sim * 100).toFixed(0)}%</span>`;
    div.onclick = () => {
      fillSongName(startStr, endStr, c.title).catch(reportError);
      $('recognize-modal').style.display = 'none';
    };
    makeKeyboardAction(div);
    list.appendChild(div);
  });

function renderRecognizeAllResults(r) {
  $('recognize-head').textContent = `全部识别结果（${(r.results || []).length} 段）`;
  $('recognize-transcript').textContent = '';
  const list = $('recognize-list');
  list.innerHTML = '';
  (r.results || []).forEach(res => {
    const head = document.createElement('div');
    head.style.cssText = 'color:#89b4fa; font-weight:bold; padding:8px 12px 2px; border-top:1px solid #313244;';
    head.textContent = `${res.start_str} ~ ${res.end_str}`;
    list.appendChild(head);
    if (!res.candidates || !res.candidates.length) {
      const div = document.createElement('div');
      div.textContent = '（未匹配到歌名）';
      list.appendChild(div);
      return;
    }
    res.candidates.slice(0, 2).forEach(c => {
      const div = document.createElement('div');
      div.innerHTML = `<span>${esc(c.title)} — ${esc(c.artist)}</span>
        <span class="size">${c.confidence} ${(c.sim * 100).toFixed(0)}%</span>`;
      div.onclick = () => {
        fillSongName(res.start_str, res.end_str, c.title).catch(reportError);
      };
      makeKeyboardAction(div);
      list.appendChild(div);
    });
  });
}

function songRow(no, s) {
  const tr = document.createElement('tr');

async function saveSongs() {
  const video = currentVideo, revision = songRevision, sessionRevision = videoRevision;
  if (!video) { log('请先选择视频后保存清单'); return false; }
  if (!songsLoaded) { log('清单尚未加载成功，请重新选择视频后重试'); return false; }

      start_str: tr.querySelector('.in-start').value.trim(),
      end_str: tr.querySelector('.in-end').value.trim(),

    await apiRequest('/api/songs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({video, songs}),

    if (video === currentVideo && sessionRevision === videoRevision) {
      $('save-state').textContent = '保存失败，请检查清单后重试';

// ---------- 目录浏览 ----------
async function browse(path) {
  const response = await fetch(`/api/browse?path=${encodeURIComponent(path || '')}`);
  const r = await response.json();
  if (!response.ok) {
    $('browse-path').textContent = '无法打开路径';
    $('browse-list').textContent = (r.detail || '读取目录失败') + '。请关闭后填写目录路径重试。';
    return;
  }
  $('browse-path').textContent = r.path;
  const list = $('browse-list');
  list.innerHTML = '';
  const mk = (icon, name, info, onClick) => {
    const div = document.createElement('div');
    div.innerHTML = `<span>${icon} ${esc(name)}</span><span class="size">${info || ''}</span>`;
    div.onclick = onClick;
    makeKeyboardAction(div);
    list.appendChild(div);
  };
  if (r.parent) mk('', '返回上级目录', '', () => browse(r.parent));
  for (const e of r.entries) {
    if (e.is_dir) mk('', e.name, '文件夹', () => browse(e.path));
    else if (e.is_video) mk('', e.name, fmtSize(e.size), () => {
      setVideo(e.path).then(selected => { if (selected) closeBrowse(); }).catch(reportError);
    });
  }
}
function fmtSize(n) {
  if (n == null) return '';
  if (n > 1e9) return (n / 1e9).toFixed(1) + ' GB';
  if (n > 1e6) return (n / 1e6).toFixed(0) + ' MB';
  return (n / 1e3).toFixed(0) + ' KB';
}
function closeBrowse() { $('browse-modal').style.display = 'none'; }
$('btn-browse').onclick = () => {
  $('browse-modal').style.display = 'flex';
  browse($('video-path').value || '');
  $('btn-browse-close').focus();
};

// ---------- 拖入导入视频 ----------
// dragenter/dragleave 会在子元素间来回触发，用计数防止高亮闪烁
let _dragDepth = 0;
document.addEventListener('dragenter', e => {
  e.preventDefault();
  if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  _dragDepth++;
  document.body.classList.add('dragging');
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('dragleave', e => {
  e.preventDefault();
  if (--_dragDepth <= 0) {
    _dragDepth = 0;
    document.body.classList.remove('dragging');
  }
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const f = (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  if (!f) return;
  if (!/\.(mp4|m4v|webm|flv|mkv|ts|mov|avi|wmv)$/i.test(f.name)) {
    alert(`不是视频文件: ${f.name}`); return;
  }
  log(`正在定位导入的视频: ${f.name}`);
  // hint_dir：上次视频所在的目录（兼容 / 与 \ 路径分隔符）
  const m = currentVideo.match(/^.*[\\\/]/);
  const r = await fetch('/api/locate-video', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: f.name, hint_dir: m ? m[0] : ''}),
  });
  if (!r.ok) { alert('未在常用目录找到该文件，请用「浏览」手动选择'); return; }
  const {path} = await r.json();
  try {
    if (await setVideo(path)) log(`已导入视频: ${path}`);
  } catch (error) { reportError(error); }
});

// ---------- 播放器 ----------
let playbackRate = 1;   // 记住倍速，切换视频后仍保持
let playerHeight = 310;
const playerResizer = $('player-resizer');
let playerDrag = null;

function resizePlayer(height) {
  const available = Math.max(0, window.innerHeight - document.querySelector('header').getBoundingClientRect().height);
  const max = Math.max(0, available - Math.min(120, available / 3));
  const min = Math.min(window.innerWidth <= 700 ? 300 : 180, max);
  playerHeight = Math.round(Math.min(max, Math.max(min, height)));
  $('video-wrap').style.height = `${playerHeight}px`;
  playerResizer.setAttribute('aria-valuemin', Math.round(min));
  playerResizer.setAttribute('aria-valuemax', Math.round(max));
  playerResizer.setAttribute('aria-valuenow', playerHeight);
}

playerResizer.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  event.preventDefault();
  playerDrag = { y: event.clientY, height: playerHeight, id: event.pointerId };
  playerResizer.setPointerCapture(event.pointerId);
});
playerResizer.addEventListener('pointermove', event => {
  if (!playerDrag || event.pointerId !== playerDrag.id) return;
  resizePlayer(playerDrag.height + playerDrag.y - event.clientY);
});
function stopPlayerResize(event) {
  if (!playerDrag || event.pointerId !== playerDrag.id) return;
  playerDrag = null;
  if (playerResizer.hasPointerCapture(event.pointerId)) playerResizer.releasePointerCapture(event.pointerId);
}
playerResizer.addEventListener('pointerup', stopPlayerResize);
playerResizer.addEventListener('pointercancel', stopPlayerResize);
playerResizer.addEventListener('lostpointercapture', stopPlayerResize);
playerResizer.addEventListener('keydown', event => {
  if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
  event.preventDefault();
  resizePlayer(playerHeight + (event.key === 'ArrowUp' ? 20 : -20));
});
window.addEventListener('resize', () => resizePlayer(playerHeight));

function initPlayer() {
  const show = $('chk-player').checked;
  $('video-wrap').style.display = show && currentVideo ? 'block' : 'none';
  if (!show || !currentVideo) return;
  resizePlayer(playerHeight);
  const p = $('player');
  const src = `/api/stream?path=${encodeURIComponent(currentVideo)}`;
  // 只在视频变化时重设 src：重复赋值会触发重新缓冲，每次跳转都要等
  if (p.dataset.src !== src) {
    p.dataset.src = src;
    p.src = src;
  }
  p.playbackRate = playbackRate;
}
$('chk-player').onchange = initPlayer;

// 播放位置微调（用于精确对齐歌曲起止）
function nudge(delta) {
  const p = $('player');
  if (!isFinite(p.duration)) return;
  p.currentTime = Math.min(p.duration, Math.max(0, p.currentTime + delta));
}

// 倍速切换，并高亮当前档位
function setRate(rate) {
  playbackRate = rate;
  $('player').playbackRate = rate;
  document.querySelectorAll('#player-ctrl [data-rate]').forEach(b =>
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate));
}

document.querySelectorAll('#player-ctrl [data-seek]').forEach(btn => {
  btn.onclick = () => nudge(parseFloat(btn.dataset.seek));
});
document.querySelectorAll('#player-ctrl [data-rate]').forEach(btn => {
  btn.onclick = () => setRate(parseFloat(btn.dataset.rate));
});

function updateTime() {
  const p = $('player');
  $('player-time').textContent =
    `${fmtH(p.currentTime || 0)} / ${fmtH(isFinite(p.duration) ? p.duration : 0)}`;
}
$('player').addEventListener('timeupdate', updateTime);
$('player').addEventListener('seeked', updateTime);
// 换视频后浏览器会把倍速重置为 1，元数据就绪时补回来
$('player').addEventListener('loadedmetadata', () => {
  updateTime();
  $('player').playbackRate = playbackRate;
});

function jumpTo(sec) {
  if ($('chk-player').checked && currentVideo) {
    initPlayer();
    $('player').currentTime = Math.max(0, sec);
    $('player').play().catch(() => {});
  } else {
    log('请勾选"内嵌播放器"后点击候选行跳转试听');
  }
}

// ---------- 初始加载 ----------
// 长任务显示忙碌状态，避免重复点击启动多个分析或剪切任务。
['btn-analyze', 'btn-cut', 'btn-save-songs', 'btn-recognize-all'].forEach(id => {
  const button = $(id), action = button.onclick;
  button.onclick = async () => {
    const label = button.textContent;
    button.disabled = true;
    button.textContent = id === 'btn-save-songs' ? '保存中…' : '处理中…';
    button.setAttribute('aria-busy', 'true');
    try { await action(); }
    catch (error) { reportError(error); } finally {
      button.disabled = false;
      button.textContent = label;
      button.removeAttribute('aria-busy');
    }
  };
});
if (currentVideo) setVideo(currentVideo, true).catch(reportError);
else {
  loadCandidates().catch(reportError);
  loadSongs().catch(reportError);
  initPlayer();
}
</script>
